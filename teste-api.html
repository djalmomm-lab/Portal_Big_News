<!DOCTYPE html>
<html>
<head>
    <title>Teste API Big News</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        button { padding: 10px; margin: 5px; cursor: pointer; }
        pre { background: #f4f4f4; padding: 10px; }
    </style>
</head>
<body>
    <h1>🧪 Teste da API Big News</h1>
    
    <button onclick="listarArtigos()">Listar Artigos</button>
    <button onclick="buscarArtigo(1)">Buscar Artigo ID 1</button>
    <button onclick="listarGlossario()">Listar Glossário</button>
    <button onclick="buscarGlossario('PL')">Buscar 'PL' no Glossário</button>
    <button onclick="criarArtigo()">Criar Novo Artigo</button>
    
    <h3>Resultado:</h3>
    <pre id="resultado">Clique em um botão para testar...</pre>

    <script>
        const API_URL = 'http://localhost:3000/api';
        
        async function listarArtigos() {
            const res = await fetch(`${API_URL}/artigos`);
            const dados = await res.json();
            document.getElementById('resultado').textContent = 
                JSON.stringify(dados, null, 2);
        }
        
        async function buscarArtigo(id) {
            const res = await fetch(`${API_URL}/artigos/${id}`);
            const dados = await res.json();
            document.getElementById('resultado').textContent = 
                JSON.stringify(dados, null, 2);
        }
        
        async function listarGlossario() {
            const res = await fetch(`${API_URL}/glossario`);
            const dados = await res.json();
            document.getElementById('resultado').textContent = 
                JSON.stringify(dados, null, 2);
        }
        
        async function buscarGlossario(termo) {
            const res = await fetch(`${API_URL}/glossario?busca=${termo}`);
            const dados = await res.json();
            document.getElementById('resultado').textContent = 
                JSON.stringify(dados, null, 2);
        }
        
        async function criarArtigo() {
            const novoArtigo = {
                titulo: "Artigo Teste " + new Date().toLocaleTimeString(),
                categoria: "legislativo",
                conteudo: "Conteúdo de teste...",
                tempo_leitura: 10
            };
            
            const res = await fetch(`${API_URL}/admin/artigos`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(novoArtigo)
            });
            
            const dados = await res.json();
            document.getElementById('resultado').textContent = 
                JSON.stringify(dados, null, 2);
        }
    </script>
</body>
</html>
